  <style>
    #orientation-overlay { display: none; }

    @media (orientation: portrait) {
      #orientation-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 25px;
        background: #080e20;
        color: #f5f8ff;
        text-align: center;
        line-height: 2;
      }

      #orientation-overlay .rotate-icon {
        font-size: 55px;
        margin-bottom: 20px;
      }

      #orientation-overlay strong { font-size: 19px; }

      #orientation-overlay p {
        margin-top: 12px;
        color: #aab8d4;
        font-size: 12px;
      }
    }
